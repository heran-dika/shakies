<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pick up Location — Shakies</title>
<script>
  // Kalau halaman ini diakses LANGSUNG (bukan dari dalam iframe sheet index.html),
  // redirect balik ke index.html terus otomatis buka kertasnya (pola sama kayak menu.html).
  if (window.top === window.self) {
    location.replace('index.html?open=pickup');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDF0F0; --surface:#FFFFFF; --navy:#1F3864; --navy-soft:#2C4372;
    --pill:#F3AEB0; --pill-shadow:#E89599;
  }
  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--navy);
    display:flex; flex-direction:column;
  }

  .tabs{ flex:0 0 auto; display:flex; gap:8px; padding:4px 16px 12px; }
  .tab{
    flex:1; border:none; border-radius:14px; padding:10px 8px; cursor:pointer;
    font:inherit; font-weight:700; font-size:14px; color:var(--navy);
    background:var(--surface); box-shadow:0 2px 0 rgba(31,56,100,.12);
    -webkit-tap-highlight-color:transparent;
  }
  .tab[aria-selected="true"]{ background:var(--navy); color:#fff; box-shadow:0 2px 0 #14264a; }

  .map-wrap{ position:relative; flex:1 1 auto; min-height:0; margin:0 16px; border-radius:16px; overflow:hidden; background:var(--surface); box-shadow:0 2px 10px rgba(31,56,100,.15); }
  .map-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:none; display:block;
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  /* Efek "masuk ke dalam peta": peta zoom-in + fade out, street view zoom-in dari agak gede + fade in */
  #mapFrame.out{ opacity:0; transform:scale(1.15); pointer-events:none; }
  #streetFrame{ opacity:0; transform:scale(1.15); pointer-events:none; }
  #streetFrame.in{ opacity:1; transform:scale(1); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce){ .map-wrap iframe{ transition:none; } }

  .actions{ flex:0 0 auto; display:flex; gap:8px; padding:12px 16px 0; }
  .actions a, .actions button{
    display:block; flex:1; text-align:center; background:var(--pill); color:var(--navy);
    font:inherit; font-weight:700; font-size:14px; text-decoration:none; padding:12px 8px;
    border:none; border-radius:14px; box-shadow:0 3px 0 var(--pill-shadow); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .actions a:active, .actions button:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--pill-shadow); }
  .note{
    flex:0 0 auto; margin:0; padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 14px);
    font-size:11.5px; line-height:1.45; color:var(--navy-soft); text-align:center;
  }
</style>
</head>
<body>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabMap" role="tab" aria-selected="true">🗺️ Peta</button>
    <button class="tab" id="tabStreet" role="tab" aria-selected="false">🚶 Street View</button>
  </div>

  <div class="map-wrap">
    <iframe id="mapFrame" src="https://www.google.com/maps?q=-6.2708882,106.9705108&z=17&output=embed" title="Lokasi Shakies" allowfullscreen></iframe>
    <iframe id="streetFrame" title="Street view Shakies" allowfullscreen></iframe>
  </div>

  <div class="actions">
    <a id="mapsLink" href="https://www.google.com/maps/place/SHAKIES/@-6.2708882,106.9705108,17z/data=!3m1!4b1!4m6!3m5!1s0x2e698dab46fe07e3:0xaa4eb78bdda773a!8m2!3d-6.2708882!4d106.9705108!16s%2Fg%2F11ydntrgmx" target="_blank" rel="noopener">Buka di Maps</a>
    <button type="button" id="copyBtn">Salin Alamat</button>
  </div>
  <p class="note">Untuk Shopee kirim &amp; GoSend, titik lokasi biasanya udah pas dan bisa langsung dipilih. Kalau pakai Grab, titiknya kadang masih agak meleset — pastiin alamat detail di atas ditulis manual biar drivernya nggak nyasar.</p>

<script>
const PICKUP_ADDRESS = 'SHAKIES - Jl. Lotus Raya Blok D2 no.11A';
const STREET_SRC = 'https://www.google.com/maps/embed?pb=!4v1791024301545!6m8!1m7!1sOwXGmpuoy6WXxrdfMN-Nmw!2m2!1d-6.270839549345338!2d106.9704510887457!3f144.43919924499897!4f-10.726405864587761!5f2.3063636750677317';

// Event Umami dikirim lewat parent (index.html), karena script Umami cuma dipasang di sana.
function track(event){ window.parent.postMessage({ type: 'shakies-track', event }, '*'); }

const mapFrame = document.getElementById('mapFrame');
const streetFrame = document.getElementById('streetFrame');
const tabMap = document.getElementById('tabMap');
const tabStreet = document.getElementById('tabStreet');

const TAB_STREET_LABEL = tabStreet.textContent;
let streetLoaded = false, wantStreet = false;

// Animasi baru jalan SETELAH iframe street view selesai load, biar nggak zoom ke layar kosong.
// Iframe cuma di-load pas tab pertama kali dibuka (hemat data), abis itu tinggal toggle class.
function applyStreet(on){
  mapFrame.classList.toggle('out', on);
  streetFrame.classList.toggle('in', on);
}
function streetReady(){
  if(streetLoaded) return;
  streetLoaded = true;
  tabStreet.textContent = TAB_STREET_LABEL;
  if(wantStreet) applyStreet(true);
}
function showStreet(on){
  wantStreet = on;
  tabMap.setAttribute('aria-selected', String(!on));
  tabStreet.setAttribute('aria-selected', String(on));
  if(!on){ applyStreet(false); return; }
  if(streetLoaded){ applyStreet(true); return; }
  if(!streetFrame.getAttribute('src')){
    tabStreet.textContent = '⏳ Memuat…';
    streetFrame.addEventListener('load', streetReady, { once: true });
    setTimeout(streetReady, 8000); // fallback kalau event load nggak kepanggil
    streetFrame.src = STREET_SRC;
  }
}
tabMap.addEventListener('click', () => showStreet(false));
tabStreet.addEventListener('click', () => { showStreet(true); track('click_pickup_streetview'); });
document.getElementById('mapsLink').addEventListener('click', () => track('click_pickup_maps'));

async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return; }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}
const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async () => {
  track('click_pickup_copy_address');
  try{
    await copyText(PICKUP_ADDRESS);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Tersalin! ✓';
    copyBtn.disabled = true;
    setTimeout(() => { copyBtn.textContent = original; copyBtn.disabled = false; }, 1500);
  }catch(e){
    alert('Alamat: ' + PICKUP_ADDRESS);
  }
});
</script>
</body>
</html>
