<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tanya Baby Chef — Shakies</title>
<script>
  // Kalau halaman ini diakses LANGSUNG (bukan dari dalam iframe sheet index.html),
  // redirect balik ke index.html terus otomatis buka kertasnya (pola sama kayak menu.html).
  if (window.top === window.self) {
    location.replace('index.html?open=baby-chef');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDF0F0; --surface:#FFFFFF; --ink:#1F4172; --ink-soft:#6B756F; --subtitle:#F1B4BB;
    --jade:#2F5D50; --jade-dark:#1E3D35;
    --chili:#C1443C; --gold:#B9852D;
    --border:#E7E1D6;
  }
  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--ink);
    display:flex; flex-direction:column;
  }

  .stage{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:16px 22px 120px; }
  .deck{ position:relative; height:100%; max-height:520px; aspect-ratio:9/16; max-width:100%; }

  .card{
    position:absolute; inset:0; border-radius:20px; overflow:hidden; background:#000;
    box-shadow:0 10px 26px rgba(31,65,114,.22);
    touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab;
    -webkit-tap-highlight-color:transparent;
    transition:transform .38s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    will-change:transform;
  }
  .card.dragging{ transition:none; cursor:grabbing; }
  .card.playing{ cursor:default; touch-action:auto; box-shadow:0 14px 34px rgba(31,65,114,.35); }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
  .card iframe{ width:100%; height:100%; border:none; display:block; }

  .card-info{
    position:absolute; left:0; right:0; bottom:0; padding:48px 16px 16px; pointer-events:none; color:#fff;
    background:linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0));
  }
  .card-info{ transition:opacity .25s ease; }
  .info-peek{
    position:absolute; left:0; right:0; bottom:0; padding:9px 14px 10px;
    background:rgba(0,0,0,.82); color:#fff; border-left:4px solid transparent;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px; line-height:1.25;
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .info-peek span{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .accent-jade .info-peek{ border-left-color:var(--jade); }
  .accent-chili .info-peek{ border-left-color:var(--chili); }
  .accent-gold .info-peek{ border-left-color:var(--gold); }
  /* card tepat di belakang: judul tampil di strip bawah; card lebih dalam: polos aja */
  .card.is-back .card-info, .card.is-deep .card-info{ opacity:0; }
  .card.is-back .info-peek{ opacity:1; }
  .faq-tag{
    display:inline-block; color:#fff; font-size:11px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; padding:3px 10px; border-radius:8px; margin-bottom:8px;
  }
  .accent-jade .faq-tag{ background:var(--jade); }
  .accent-chili .faq-tag{ background:var(--chili); }
  .accent-gold .faq-tag{ background:var(--gold); }
  .faq-question{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; line-height:1.25; margin:0; }

  .badge{
    position:absolute; top:18px; padding:6px 12px; border-radius:10px; border:2px solid #fff;
    font-weight:700; font-size:15px; letter-spacing:.05em; color:#fff; opacity:0; pointer-events:none;
  }
  .badge-next{ left:16px; background:var(--chili); transform:rotate(-8deg); }
  .badge-prev{ right:16px; background:var(--jade); transform:rotate(8deg); }

  .controls{
    flex:0 0 auto; min-height:84px; display:flex; align-items:center; justify-content:center; gap:16px;
    padding:6px 22px calc(env(safe-area-inset-bottom,0px) + 16px);
  }
  .ctl{
    width:52px; height:52px; border-radius:50%; border:2px solid; background:var(--surface);
    font-size:20px; font-weight:700; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(31,65,114,.15); -webkit-tap-highlight-color:transparent;
  }
  .ctl:active{ transform:scale(.92); }
  .ctl-list{ color:var(--ink); border-color:var(--ink-soft); font-size:18px; }
  .ctl-left{ color:var(--chili); border-color:var(--chili); }
  .ctl-right{ color:var(--jade); border-color:var(--jade); }
  .ctl-play{ color:var(--gold); border-color:var(--gold); }
  .back-btn{
    background:var(--jade); color:#fff; border:none; border-radius:14px; padding:13px 22px;
    font-weight:700; font-size:14px; font-family:inherit; cursor:pointer;
    box-shadow:0 3px 0 var(--jade-dark); -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--jade-dark); }

  .list-overlay{
    position:fixed; inset:0; background:rgba(31,65,114,.45);
    display:flex; align-items:flex-end; justify-content:center; z-index:200;
  }
  .list-overlay[hidden]{ display:none; }
  .list-panel{
    background:var(--surface); width:100%; max-width:420px; border-radius:20px 20px 0 0;
    max-height:70vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .list-header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px;
    font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--ink);
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .list-close{
    border:none; background:var(--bg); color:var(--ink); width:28px; height:28px; border-radius:50%;
    font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .list-items{ overflow-y:auto; padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px); }
  .list-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; padding:11px 8px; border-radius:12px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:14px; color:var(--ink); line-height:1.35;
    -webkit-tap-highlight-color:transparent;
  }
  .list-item:active{ background:var(--bg); }
  .list-item .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .list-item.accent-jade .dot{ background:var(--jade); }
  .list-item.accent-chili .dot{ background:var(--chili); }
  .list-item.accent-gold .dot{ background:var(--gold); }
  .list-item.current{ font-weight:700; }
  .list-item.current .dot{ box-shadow:0 0 0 3px var(--bg), 0 0 0 4px currentColor; }
</style>
</head>
<body>
  <div class="stage"><div class="deck" id="deck"></div></div>

  <div class="controls" id="ctlNormal">
    <button type="button" class="ctl ctl-list" id="btnList" aria-label="Daftar pertanyaan">☰</button>
    <button type="button" class="ctl ctl-left" id="btnLeft" aria-label="Lewati (maju)">←</button>
    <button type="button" class="ctl ctl-right" id="btnRight" aria-label="Balik (mundur)">→</button>
    <button type="button" class="ctl ctl-play" id="btnPlay" aria-label="Putar video">▶</button>
  </div>
  <div class="controls" id="ctlPlaying" hidden>
    <button type="button" class="back-btn" id="btnBack">Selesai · video berikutnya</button>
  </div>

  <div class="list-overlay" id="listOverlay" hidden>
    <div class="list-panel">
      <div class="list-header">
        <span>Daftar Pertanyaan</span>
        <button type="button" class="list-close" id="listCloseBtn" aria-label="Tutup">✕</button>
      </div>
      <div class="list-items" id="listItems"></div>
    </div>
  </div>

<script type="module">
// Data FAQ produk knowledge. Nambah video baru: tinggal push object baru ke array ini.
const FALLBACK_FAQS = [
  { pertanyaan: "Roti Shakies Gak Habis? Ini Cara Simpan Biar Tetap Empuk (Suhu Ruang, Kulkas, Freezer)", videoId: "KqMzNIZcQP8" },
  { pertanyaan: "Kenapa Roti Shakies Terasa Lebih Ringan?", videoId: "8VFUFveX61I" },
  { pertanyaan: "Pumpkin Donut Shakies: Kenapa Bisa Selembut Ini?", videoId: "radVnFHpo70" },
  { pertanyaan: "Cara Menghangatkan Roti Shakies: Air Fryer atau Oven, Jangan Microwave!", videoId: "JDLOL3VlIqA" }
];

// Daftar video dibaca dari faqs.json (diedit lewat admin-baby-chef.html).
// Entri rusak dibuang; kalau file gagal dimuat / kosong, pakai FALLBACK_FAQS di atas.
async function loadFaqs(){
  try{
    const res = await fetch('./faqs.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error('bukan array');
    const seen = new Set();
    const clean = data
      .filter(f => f && f.aktif !== false
        && typeof f.videoId === 'string' && /^[\w-]{11}$/.test(f.videoId)
        && typeof f.pertanyaan === 'string' && f.pertanyaan.trim()
        && !seen.has(f.videoId) && seen.add(f.videoId))
      .map(f => ({ pertanyaan: f.pertanyaan.trim(), videoId: f.videoId }));
    return clean.length ? clean : FALLBACK_FAQS;
  } catch(e){
    return FALLBACK_FAQS;
  }
}
const FAQS = await loadFaqs();
const ACCENTS = ['jade', 'chili', 'gold'];
const THRESHOLD = 90;   // px geser minimal biar dianggap swipe
const TAP_SLOP = 6;     // gerak di bawah ini dianggap tap, bukan drag
const OUT_MS = 200;    // durasi transisi lempar-keluar (nextCard) / masuk (prevCard fase 3)
const SNAP_MS = 140;   // prevCard fase 1: front balik persis ke tengah
const RECEDE_MS = 220; // prevCard fase 2: front (dkk) mundur ke rank barunya

function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }

const deck = document.getElementById('deck');
const ctlNormal = document.getElementById('ctlNormal');
const ctlPlaying = document.getElementById('ctlPlaying');

function cardHTML(i){
  const faq = FAQS[i];
  return `<img src="https://img.youtube.com/vi/${faq.videoId}/hqdefault.jpg" alt="" draggable="false">
    <div class="card-info"><span class="faq-tag">FAQ ${i + 1}</span><p class="faq-question">${escapeHtml(faq.pertanyaan)}</p></div>
    <div class="info-peek"><span>${escapeHtml(faq.pertanyaan)}</span></div>
    <span class="badge badge-next">LEWATI ▷</span><span class="badge badge-prev">◁ BALIK</span>`;
}

const cards = FAQS.map((_, i) => {
  const el = document.createElement('div');
  el.className = 'card accent-' + ACCENTS[i % ACCENTS.length];
  el.innerHTML = cardHTML(i);
  deck.appendChild(el);
  return el;
});

// order[0] = card paling depan. Swipe kanan = shift ke belakang (push ke akhir array).
let order = FAQS.map((_, i) => i);
let playing = false, busy = false;

// Kalau dibuka lewat link share (?faq=VIDEO_ID), majuin video itu ke depan tumpukan dulu.
(function(){
  const wantId = new URLSearchParams(location.search).get('faq');
  if(!wantId) return;
  const pos = order.findIndex(idx => FAQS[idx].videoId === wantId);
  if(pos > 0) order.unshift(...order.splice(pos, 1));
})();

// Kasih tau parent (index.html) video mana yang lagi di depan -- dipakai tombol share
// di header kertas biar tau link mana yang mesti di-copy.
function notifyFront(){
  window.parent.postMessage({ type: 'shakies-baby-chef-front', videoId: FAQS[order[0]].videoId }, '*');
}

function front(){ return cards[order[0]]; }

// Tumpukan: card depan di tengah. SEMUA card lain di belakangnya harus keintip dikit
// (nggak boleh ada yang keumpet), karena swipe kanan narik langsung card paling belakang.
// Rank 1 = judulnya kebaca di strip; rank 2+ = sliver polos, makin dalam makin rapat & kecil
// (nambah jarak dibatasi PEEK_STEP_MAX_RANK biar nggak numpuk sampe luar layar kalau videonya banyak).
const PEEK_STEP_MAX_RANK = 4;
function peekFor(rank){ return 56 + (Math.min(rank, PEEK_STEP_MAX_RANK) - 1) * 16; }
function scaleFor(rank){ return Math.max(0.72, 1 - Math.min(rank, PEEK_STEP_MAX_RANK) * 0.055); }
// Posisi istirahat SEMUA card selain depan itu tetap (nggak digeser ke samping) -- efek
// "masuk dari kanan" pas swipe kanan itu dari animasi lempar transient di prevCard(),
// bukan dari posisi diemnya (kalau posisi diemnya digeser permanen, card yang abis dilempar
// ke kiri dan jadi paling belakang bakal keseret aneh dari ujung kiri ke ujung kanan).
// Posisi istirahat di rank tertentu -- dipake layout() (final) dan prevCard() fase 2 (transisi).
function restPos(rank){
  if(rank === 0) return { ty: 0, scale: 1 };
  const scale = scaleFor(rank);
  const H = deck.offsetHeight;
  const ty = peekFor(rank) + (1 - scale) * H / 2; // scale ngecilin ke tengah, tepi bawah naik -- dikompensasi
  return { ty, scale };
}
function layout(){
  const total = order.length;
  order.forEach((idx, rank) => {
    const el = cards[idx];
    el.style.zIndex = total - rank;
    el.classList.toggle('is-back', rank === 1);
    el.classList.toggle('is-deep', rank >= 2);
    if(rank === 0){
      el.style.transform = 'translate3d(0,0,0) rotate(0deg) scale(1)';
    } else {
      const { ty, scale } = restPos(rank);
      el.style.transform = `translate3d(0,${ty}px,0) scale(${scale})`;
    }
    el.style.opacity = '1';
  });
}
window.addEventListener('resize', () => { if(!playing && !busy) layout(); });

function resetAllBadges(){
  cards.forEach(el => el.querySelectorAll('.badge').forEach(b => { b.style.opacity = 0; }));
}

// Maju: card depan geser ke kiri (tetap keliatan), nyelip ke urutan paling belakang, rank-1 jadi depan.
// Sengaja nggak pernah di-opacity 0 / disembunyiin: card selalu keliatan bergerak, jadi nggak ada jeda kosong.
function nextCard(){
  if(busy || playing) return;
  if(order.length < 2){ layout(); return; }
  busy = true;
  const idx = order.shift();
  const el = cards[idx];
  el.style.zIndex = 99;
  layout(); // card di belakangnya langsung maju ke depan
  el.style.transition = `transform ${OUT_MS}ms ease-out`;
  el.style.transform = `translate3d(-${Math.round(deck.offsetWidth * 0.85)}px,0,0) rotate(-14deg)`;
  setTimeout(() => {
    el.style.transition = ''; // balik ke transisi default
    order.push(idx);
    layout();                 // zIndex jadi paling bawah + meluncur ke posisi belakang tumpukan
    busy = false;
    notifyFront();
  }, OUT_MS);
}

// Mundur -- 3 fase BERURUTAN (bukan bareng), biar tiap gerakan keliatan jelas satu-satu,
// nggak "lompat": (1) card yang lagi dipegang balik persis ke tengah dulu, (2) BARU dia
// (+ card lain di antaranya) mundur ke rank barunya, (3) BARU card paling belakang meluncur
// masuk dari kanan jadi depan -- mirror animasi lempar-kiri di nextCard, arah dibalik.
function prevCard(){
  if(busy || playing) return;
  if(order.length < 2){ layout(); return; }
  busy = true;
  const frontEl = front();
  const deepIdx = order[order.length - 1];
  const deepEl = cards[deepIdx];

  // Fase 1: card yang dipegang balik persis ke tengah (ngilangin sisa offset/rotasi drag).
  frontEl.style.transition = `transform ${SNAP_MS}ms ease-out`;
  frontEl.style.transform = 'translate3d(0,0,0) rotate(0deg)';

  setTimeout(() => {
    // Fase 2: `order` BELUM diubah di sini -- dihitung manual: tiap card KECUALI yang paling
    // belakang mundur ke targetRank = rank sekarang + 1. Card paling belakang (deepEl) sama
    // sekali nggak disentuh, diem di posisi lamanya sampai fase 3.
    order.slice(0, -1).forEach((idx, rank) => {
      const el = cards[idx];
      const targetRank = rank + 1;
      el.style.transition = `transform ${RECEDE_MS}ms ease-out`;
      el.classList.toggle('is-back', targetRank === 1);
      el.classList.toggle('is-deep', targetRank >= 2);
      const { ty, scale } = restPos(targetRank);
      el.style.transform = `translate3d(0,${ty}px,0) scale(${scale})`;
      el.style.zIndex = order.length - targetRank;
    });

    setTimeout(() => {
      order.slice(0, -1).forEach(idx => { cards[idx].style.transition = ''; }); // balik ke default

      // Fase 3: BARU sekarang beneran di-reorder, card paling belakang meluncur masuk dari
      // kanan jadi depan. layout() nge-set semua card ke rank final -- yang laen udah pas
      // dari fase 2 (no-op buat mereka), cuma deepEl yang keliatan gerak (transisi custom).
      deepEl.style.transition = 'none';
      deepEl.style.zIndex = 99;
      deepEl.style.transform = `translate3d(${Math.round(deck.offsetWidth * 0.85)}px,0,0) rotate(14deg)`;
      void deepEl.offsetWidth; // force reflow biar posisi luar-layar ke-apply dulu sebelum transisi nyala
      deepEl.style.transition = `transform ${OUT_MS}ms ease-out`;
      order.unshift(order.pop());
      layout();
      setTimeout(() => {
        deepEl.style.transition = '';
        busy = false;
        notifyFront();
      }, OUT_MS);
    }, RECEDE_MS);
  }, SNAP_MS);
}

// Card depan "maju" (balik ke tengah + sedikit membesar), terus iframe YouTube dipasang & autoplay.
function playFront(){
  if(busy || playing) return;
  playing = true;
  const idx = order[0];
  const el = cards[idx];
  el.classList.add('playing');
  el.style.transform = 'translate3d(0,0,0) rotate(0deg) scale(1.03)';
  cards.forEach(c => { if(c !== el) c.style.opacity = '0'; });
  el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${FAQS[idx].videoId}?autoplay=1&playsinline=1&rel=0&enablejsapi=1" title="Video Shakies" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  ctlNormal.hidden = true;
  ctlPlaying.hidden = false;
}

// Tutup video (iframe dibuang = video berhenti), card dikembalikan, terus lanjut ke video berikutnya.
function closeVideo(){
  if(!playing) return;
  const idx = order[0];
  const el = cards[idx];
  playing = false;
  el.classList.remove('playing');
  el.innerHTML = cardHTML(idx);
  ctlPlaying.hidden = true;
  ctlNormal.hidden = false;
  layout();
  nextCard();
}

// ---- Drag (Pointer Events: jalan buat touch & mouse) ----
let sx = 0, sy = 0, dx = 0, dragging = false, pid = null;

deck.addEventListener('pointerdown', (e) => {
  if(playing || busy) return;
  const el = front();
  if(!el.contains(e.target)) return;
  dragging = true; sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId;
  el.classList.add('dragging');
  el.setPointerCapture(pid);
});

// Preview drag: cuma card DEPAN yang gerak, ngikutin jari 1:1 (posisi + rotasi), dua arah
// sama persis. Card lain diem total di posisi istirahatnya -- animasi "card belakang masuk"
// baru kejadian di prevCard() pas dilepas (lihat komentar di sana), bukan selama drag.
deck.addEventListener('pointermove', (e) => {
  if(!dragging || e.pointerId !== pid) return;
  dx = e.clientX - sx;
  const dy = (e.clientY - sy) * 0.3;
  const el = front();
  el.style.transform = `translate3d(${dx}px,${dy}px,0) rotate(${dx * 0.06}deg)`;
  const p = Math.min(1, Math.abs(dx) / THRESHOLD);
  el.querySelector('.badge-next').style.opacity = dx < 0 ? p : 0;
  el.querySelector('.badge-prev').style.opacity = dx > 0 ? p : 0;
});

function endDrag(e, cancelled){
  if(!dragging || e.pointerId !== pid) return;
  dragging = false;
  const el = front();
  el.classList.remove('dragging');
  resetAllBadges();
  const moved = Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy);
  if(cancelled) layout();
  else if(dx < -THRESHOLD) nextCard();
  else if(dx > THRESHOLD) prevCard();
  else if(moved < TAP_SLOP) playFront(); // tap tanpa geser = putar
  else layout(); // geser kurang jauh: membal balik
  dx = 0;
}
deck.addEventListener('pointerup', (e) => endDrag(e, false));
deck.addEventListener('pointercancel', (e) => endDrag(e, true));

document.getElementById('btnLeft').addEventListener('click', nextCard);
document.getElementById('btnRight').addEventListener('click', prevCard);
document.getElementById('btnPlay').addEventListener('click', playFront);
document.getElementById('btnBack').addEventListener('click', closeVideo);

// ---- Daftar pertanyaan (tombol ☰): buka panel semua FAQ, tap salah satu -> loncat ke card itu ----
const btnList = document.getElementById('btnList');
const listOverlay = document.getElementById('listOverlay');
const listItems = document.getElementById('listItems');
const listCloseBtn = document.getElementById('listCloseBtn');

function renderList(){
  listItems.innerHTML = FAQS.map((faq, i) => `
    <button type="button" class="list-item accent-${ACCENTS[i % ACCENTS.length]}${order[0] === i ? ' current' : ''}" data-video-id="${faq.videoId}">
      <span class="dot"></span><span>${escapeHtml(faq.pertanyaan)}</span>
    </button>`).join('');
}
function openList(){
  if(playing) return;
  renderList();
  listOverlay.hidden = false;
}
function closeList(){
  listOverlay.hidden = true;
}
// Loncat langsung ke card manapun (bukan swipe satu-satu) -- reuse layout() polos,
// nggak perlu koreografi lempar/masuk kayak nextCard/prevCard karena ini aksi pilih-dari-list,
// bukan gesture, jadi cukup kartu-kartu geser rapi ke rank barunya.
function jumpTo(videoId){
  if(busy || playing) return;
  const pos = order.findIndex(idx => FAQS[idx].videoId === videoId);
  if(pos > 0) order.unshift(...order.splice(pos, 1));
  layout();
  notifyFront();
  closeList();
}

btnList.addEventListener('click', openList);
listCloseBtn.addEventListener('click', closeList);
listOverlay.addEventListener('click', (e) => { if(e.target === listOverlay) closeList(); });
listItems.addEventListener('click', (e) => {
  const item = e.target.closest('.list-item');
  if(item) jumpTo(item.dataset.videoId);
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && !listOverlay.hidden) closeList();
});

// index.html ngirim pesan ini tiap kertas ditutup. Kertas cuma di-geser keluar layar (iframe-nya
// tetep hidup), jadi tanpa ini video jalan terus di belakang.
window.addEventListener('message', (e) => {
  if(e.source !== window.parent || e.data !== 'shakies-sheet-closed') return;
  const yt = document.querySelector('.card.playing iframe');
  if(yt) yt.contentWindow.postMessage(JSON.stringify({ event:'command', func:'pauseVideo', args:'' }), '*');
});

layout();
notifyFront();

// Geser ke bawah dari area kosong (bukan dari card) -> nutup kertas, pola sama kayak menu.html.
// Sentuhan yang mulai di card sengaja diabaikan biar nggak bentrok sama swipe card.
(function(){
  let startY = null, tracking = false;
  const CLOSE_THRESHOLD = 70;
  window.addEventListener('touchstart', e=>{
    tracking = !e.target.closest('.card');
    startY = tracking ? e.touches[0].clientY : null;
  }, { passive: true });
  window.addEventListener('touchmove', e=>{
    if(!tracking) return;
    if(e.touches[0].clientY - startY > 0) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking = false;
    const dy = e.changedTouches[0].clientY - startY;
    if(dy > CLOSE_THRESHOLD){
      if (window.top !== window.self) {
        window.parent.postMessage('shakies-menu-close', '*');
      } else {
        history.back();
      }
    }
  });
})();
</script>
</body>
